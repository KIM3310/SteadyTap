name: pages-auto-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-auto-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate static content before upload
        run: make verify-site

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check publication prerequisites
        id: prerequisites
        run: python3 scripts/pages_release.py prerequisites --event-name "$GITHUB_EVENT_NAME"
      - name: Prepare revision evidence
        if: steps.prerequisites.outputs.ready == 'true'
        run: python3 scripts/pages_release.py prepare --revision "$GITHUB_SHA"
      - name: Deploy static site
        if: steps.prerequisites.outputs.ready == 'true'
        run: npx --yes wrangler@4.114.0 pages deploy site --project-name=steadytap --branch=main --commit-hash="$GITHUB_SHA"
      - name: Verify published revision and all page bytes
        if: steps.prerequisites.outputs.ready == 'true'
        run: python3 scripts/pages_release.py verify --revision "$GITHUB_SHA" --origin https://steadytap.pages.dev
