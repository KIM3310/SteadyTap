name: app-store-readiness

on:
  push:
    branches:
      - main
    paths:
      - "Core/**"
      - "Views/**"
      - "Resources/**"
      - "app-store/**"
      - "site/**"
      - "scripts/validate_app_store_readiness.py"
      - "scripts/install_xcodegen.sh"
      - "Package.swift"
      - "project.yml"
      - "RootView.swift"
      - "SteadyTapApp.swift"
      - ".github/workflows/app-store-readiness.yml"
  pull_request:
    paths:
      - "Core/**"
      - "Views/**"
      - "Resources/**"
      - "app-store/**"
      - "site/**"
      - "scripts/validate_app_store_readiness.py"
      - "scripts/install_xcodegen.sh"
      - "Package.swift"
      - "project.yml"
      - "RootView.swift"
      - "SteadyTapApp.swift"
      - ".github/workflows/app-store-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-and-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate App Store surface
        run: python3 scripts/validate_app_store_readiness.py

  ios-release-build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Validate manifests and metadata
        run: |
          python3 scripts/validate_app_store_readiness.py
          plutil -lint Resources/PrivacyInfo.xcprivacy
          plutil -lint Resources/AdditionalInfo.plist

      - name: Run Swift tests
        run: swift test

      - name: Build release package
        run: swift build -c release

      - name: Generate native Xcode project
        run: |
          xcodegen_bin="$(./scripts/install_xcodegen.sh)"
          "$xcodegen_bin" generate
          xcodebuild -project SteadyTap.xcodeproj -scheme SteadyTap -list

      - name: Build unsigned iOS Release app
        run: |
          xcodebuild \
            -project SteadyTap.xcodeproj \
            -scheme SteadyTap \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/SteadyTapDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify packaged App Store resources
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/SteadyTapDerivedData/Build/Products/Release-iphoneos/SteadyTap.app"
          test -d "$app_path"
          test -n "$app_path"
          test -x "$app_path/SteadyTap"
          test -f "$app_path/Info.plist"
          test -f "$app_path/PrivacyInfo.xcprivacy"
          test -f "$app_path/Assets.car"
          test "$(plutil -extract CFBundleIdentifier raw "$app_path/Info.plist")" = "com.kim.steadytap"
          test "$(plutil -extract CFBundleShortVersionString raw "$app_path/Info.plist")" = "1.0"
          test "$(plutil -extract CFBundleVersion raw "$app_path/Info.plist")" = "1"
          test "$(plutil -extract ITSAppUsesNonExemptEncryption raw "$app_path/Info.plist")" = "false"
          plutil -lint "$app_path/Info.plist"
          plutil -lint "$app_path/PrivacyInfo.xcprivacy"
          file "$app_path/SteadyTap"
          find "$app_path" -maxdepth 2 -type f -print | sort

      - name: Build iOS Simulator Release app
        run: |
          xcodebuild \
            -project SteadyTap.xcodeproj \
            -scheme SteadyTap \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/SteadyTapSimulatorDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch Release app in iOS Simulator
        timeout-minutes: 12
        run: |
          set -euo pipefail
          device_id="$(
            xcrun simctl list devices available -j |
              python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; candidates=[(runtime,device) for runtime,devices in data.items() if ".SimRuntime.iOS-" in runtime for device in devices if device.get("isAvailable") and device["name"].startswith("iPhone")]; candidates.sort(key=lambda item: tuple(int(part) for part in item[0].split("iOS-")[-1].split("-")), reverse=True); preferred=[item for item in candidates if "Pro" in item[1]["name"]]; print((preferred or candidates)[0][1]["udid"])'
          )"
          test -n "$device_id"

          xcrun simctl shutdown "$device_id" >/dev/null 2>&1 || true
          xcrun simctl erase "$device_id"
          xcrun simctl boot "$device_id"
          open -a Simulator --args -CurrentDeviceUDID "$device_id"
          python3 - "$device_id" <<'PY'
          import subprocess
          import sys

          subprocess.run(
              ["xcrun", "simctl", "bootstatus", sys.argv[1], "-b"],
              check=True,
              timeout=240,
          )
          PY
          app_path="$RUNNER_TEMP/SteadyTapSimulatorDerivedData/Build/Products/Release-iphonesimulator/SteadyTap.app"
          test -d "$app_path"
          xcrun simctl install "$device_id" "$app_path"
          launch_output="$(xcrun simctl launch "$device_id" com.kim.steadytap)"
          app_pid="${launch_output##*: }"
          sleep 5
          kill -0 "$app_pid"
          mkdir -p "$RUNNER_TEMP/steadytap-smoke"
          xcrun simctl io "$device_id" screenshot "$RUNNER_TEMP/steadytap-smoke/steadytap-release.png"
          test -s "$RUNNER_TEMP/steadytap-smoke/steadytap-release.png"

      - name: Upload Release launch evidence
        uses: actions/upload-artifact@v6
        with:
          name: steadytap-release-launch
          path: ${{ runner.temp }}/steadytap-smoke/steadytap-release.png
          if-no-files-found: error
          retention-days: 14
