name: app-store-readiness

on:
  push:
    branches:
      - main
    paths:
      - "Core/**"
      - "Views/**"
      - "Resources/**"
      - "app-store/**"
      - "site/**"
      - "scripts/validate_app_store_readiness.py"
      - "Package.swift"
      - "RootView.swift"
      - "SteadyTapApp.swift"
      - ".github/workflows/app-store-readiness.yml"
  pull_request:
    paths:
      - "Core/**"
      - "Views/**"
      - "Resources/**"
      - "app-store/**"
      - "site/**"
      - "scripts/validate_app_store_readiness.py"
      - "Package.swift"
      - "RootView.swift"
      - "SteadyTapApp.swift"
      - ".github/workflows/app-store-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-and-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate App Store surface
        run: python3 scripts/validate_app_store_readiness.py

  ios-release-build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Validate manifests and metadata
        run: |
          python3 scripts/validate_app_store_readiness.py
          plutil -lint Resources/PrivacyInfo.xcprivacy
          plutil -lint Resources/AdditionalInfo.plist

      - name: Run Swift tests
        run: swift test

      - name: Build release package
        run: swift build -c release

      - name: Build unsigned iOS Release app
        run: |
          xcodebuild \
            -scheme SteadyTap \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/SteadyTapDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify packaged privacy manifest
        run: |
          set -euo pipefail
          app_path="$(find "$RUNNER_TEMP/SteadyTapDerivedData/Build/Products" -type d -name 'SteadyTap.app' -print -quit)"
          test -n "$app_path"
          find "$app_path" -maxdepth 4 -type f -print | sort
          privacy_path="$(find "$app_path" -type f -name 'PrivacyInfo.xcprivacy' -print -quit)"
          icon_artifact="$(find "$app_path" -type f \( -name 'Assets.car' -o -name 'AppIcon*.png' \) -print -quit)"
          test -n "$privacy_path"
          test -n "$icon_artifact"
          plutil -lint "$privacy_path"
